name: Update league data

on:
  schedule:
    # Mon / Tue / Fri at 10:00 UTC (~6am ET). Monday catches Sunday's games,
    # Tuesday finalizes after Monday Night Football, Friday refreshes after
    # Thursday night plus the week's waivers and trades.
    # Off-season runs are harmless: no change means no commit, no deploy.
    - cron: "0 10 * * 1,2,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild baked league data
        run: node scripts/build-rivalry-data.mjs

      - name: Bake Power Rankings and Playoff Odds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/build-features.mjs
        continue-on-error: true # missing/expired key just skips the AI blurbs; math still bakes

      - name: Append the trends ledger (rank, value, odds over time)
        run: node scripts/build-trends.mjs
        continue-on-error: true # a FantasyCalc hiccup keeps the last ledger

      - name: Sync the Trade Block from Sleeper
        run: node scripts/build-tradeblock.mjs
        continue-on-error: true # a Sleeper hiccup keeps the last good block

      - name: Bake matchups archive (full box scores)
        run: node scripts/build-matchups-archive.mjs
        continue-on-error: true

      - name: Bake the league knowledge pack for The Oracle
        run: node scripts/build-knowledge.mjs
        continue-on-error: true # a Sleeper hiccup keeps the last good pack

      - name: Generate fresh AI commentary for new trades/waivers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/build-commentary.mjs
        continue-on-error: true # missing/expired key just falls back to the template pool

      - name: Build the draft recap roast (skips if season already written)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-draft-recap.mjs

      - name: Post weekly digest to Slack
        run: node scripts/build-digest.mjs
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Smoke test The Oracle endpoint (canary)
        continue-on-error: true
        run: |
          sleep 60
          code=$(curl -s -o /tmp/canary.json -w "%{http_code}" -X POST https://act-dienasty.vercel.app/api/ask -H 'content-type: application/json' -d '{"question": "canary: who is the current champion?"}')
          echo "canary HTTP $code"; head -c 200 /tmp/canary.json; echo
          if [ "$code" -ge 500 ]; then echo '::error::Oracle canary got a 5xx - the endpoint is broken in prod'; exit 1; fi

      - name: Commit and push if changed
        run: |
          git config user.name "league-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Weekly league data refresh"
            git pull --rebase origin master
            git push
          fi
