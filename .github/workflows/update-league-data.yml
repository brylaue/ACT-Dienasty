name: Update league data

on:
  schedule:
    # Tuesdays 10:00 UTC (~6am ET), after Monday Night Football is final.
    # Off-season runs are harmless: no change means no commit, no deploy.
    - cron: "0 10 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild baked league data
        run: node scripts/build-rivalry-data.mjs

      - name: Generate fresh AI commentary for new trades/waivers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-commentary.mjs
        continue-on-error: true # missing/expired key just falls back to the template pool

      - name: Commit and push if changed
        run: |
          git config user.name "league-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Weekly league data refresh"
            git pull --rebase origin master
            git push
          fi
