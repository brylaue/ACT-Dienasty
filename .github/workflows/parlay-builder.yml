name: Parlay Builder bot

on:
  schedule:
    # Every 15 minutes, every day. The script works out what's due in Eastern time -
    # Tuesday opener, nag 24h before the deadline, slip at the deadline -
    # and posts each at most once per week, so delays and doubles are harmless.
    # The deadline follows the real NFL schedule: 15 min before the earliest
    # game that has a leg - Thursday night normally, but Sunday (or later) when
    # nobody took Thursday, so the cron has to run all week. It stops at the
    # league's playoff weeks. Odd minute: on-the-hour crons get delayed.
    - cron: "7,22,37,52 * * * *"   # every 15 min: the pinned board refreshes as legs land, and the lock fires on time wherever it lands
    # GitHub drifts badly (gaps of hours), so /api/parlay/tick on the site dispatches this same workflow from an external clock - see OPERATIONS.md.
  workflow_dispatch:
    inputs:
      mode:
        description: "tick (safe: does only what's due) | open | nag | compile (post that step now)"
        required: true
        default: "tick"
      channel:
        description: "channel name override (test in a private channel first)"
        required: false
        default: "weeklyparlaybuilder"

# one run at a time - a delayed tick and the next one can't both post
concurrency:
  group: parlay-builder
  cancel-in-progress: false

jobs:
  parlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Work out the mode from the schedule
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=tick" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the Parlay Builder bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional - player-prop prices (the-odds-api.com free tier)
          PARLAY_CHANNEL: ${{ github.event.inputs.channel || 'weeklyparlaybuilder' }}
        run: node scripts/parlay-bot.mjs ${{ steps.mode.outputs.mode }}
