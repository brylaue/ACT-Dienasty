name: Parlay Builder bot

on:
  schedule:
    # Hourly Tue-Thu. The script works out what's due in Eastern time -
    # Tuesday opener, nag 24h before the deadline, slip at the deadline -
    # and posts each at most once per week, so delays and doubles are harmless.
    # The deadline itself follows the real NFL schedule (2h before the
    # week's first kickoff, capped at Thu 6pm ET), and runs stop at the
    # league's playoff weeks. Odd minute: on-the-hour crons get delayed.
    - cron: "13 * * * 2,3,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "tick | open | nag | compile"
        required: true
        default: "tick"
      force:
        description: "skip the ET-hour gate (for testing)"
        required: false
        default: "true"
      channel:
        description: "channel name override (test in a private channel first)"
        required: false
        default: "weeklyparlaybuilder"

jobs:
  parlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the mode from the schedule
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then echo "force=--force" >> "$GITHUB_OUTPUT"; fi
          else
            echo "mode=tick" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the Parlay Builder bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PARLAY_CHANNEL: ${{ github.event.inputs.channel || 'weeklyparlaybuilder' }}
        run: node scripts/parlay-bot.mjs ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.force }}
